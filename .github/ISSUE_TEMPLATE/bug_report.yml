name: Bug report
description: Report a reproducible public-build bug without private data.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities, follow SECURITY.md. Do not include credentials, personal chats, memory databases or unredacted logs."
  - type: input
    id: version
    attributes:
      label: Commit or version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Minimal reproduction with synthetic input
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: OS, CPU, RAM, GPU, VRAM, driver/runtime, model and quantization
  - type: textarea
    id: logs
    attributes:
      label: Sanitized error logs
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed personal data and credentials; this is not a vulnerability disclosure.
          required: true
