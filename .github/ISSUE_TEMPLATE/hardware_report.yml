name: Hardware compatibility report
description: Share a real result, including failures and sanitized logs.
title: "[Hardware]: "
body:
  - type: input
    id: version
    attributes:
      label: Commit/version and install method
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU and dedicated VRAM
    validations:
      required: true
  - type: input
    id: cpu
    attributes:
      label: CPU and RAM
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS edition, version and architecture
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: GPU driver and runtime (ROCm/CUDA/Vulkan/CPU), llama.cpp build
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version and environment, or not used
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model, revision and quantization
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What worked, failed or was not tested?
      description: Include context/offload/FA/MTP flags, token counts and repetitions for speed results. Do not generalize one run.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized error logs
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed usernames, private paths, credentials and personal documents from this report.
          required: true
